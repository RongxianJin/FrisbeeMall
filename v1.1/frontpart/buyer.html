<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞盘购物 - 买家页面</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>飞盘购物</h1>
        
        <div id="currentProduct">
            <h2>当前商品</h2>
            <div id="productDetails"></div>
        </div>

        <div id="buyerForm" style="display: none;">
            <h2>提交购买信息</h2>
            <form id="submitForm">
                <div class="form-group">
                    <label for="buyerId">用户ID</label>
                    <input type="text" id="buyerId" placeholder="请输入您的用户ID" required>
                    <p id="buyerIdError" class="error-message"></p>
                </div>
                <div class="form-group">
                    <label for="buyerName">姓名</label>
                    <input type="text" id="buyerName" placeholder="请输入您的姓名" required>
                </div>
                <div class="form-group">
                    <label for="buyerPhone">电话</label>
                    <input type="tel" id="buyerPhone" placeholder="请输入您的电话号码" required>
                </div>
                <button type="submit">提交</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="buyer.js"></script>
</body>
</html>

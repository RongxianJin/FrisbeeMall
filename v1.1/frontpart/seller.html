<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卖家后台 - 飞盘购物系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>卖家后台</h1>
        
        <div id="addProduct">
            <h2>添加商品</h2>
            <form id="productForm" enctype="multipart/form-data">
                <input type="text" id="productName" name="productName" placeholder="商品名称" required>
                <textarea id="productDescription" name="productDescription" placeholder="商品描述" required></textarea>
                <input type="file" id="productImage" name="productImage" accept="image/*" required>
                <br> <br>
                <input type="text" id="productPrice" name="productPrice" placeholder="商品价格" required>
                <button type="submit">添加商品</button>
            </form>
        </div>

        <div id="productHistory">
            <h2>历史商品</h2>
            <ul id="productList"></ul>
        </div>

        <div id="userInfo">
            <h2>意向购买人信息</h2>
            <ul id="userList"></ul>
        </div>

        <div id="updatePassword">
            <h2>修改密码</h2>
            <form id="passwordForm">
                <input type="password" id="newPassword" placeholder="新密码" required>
                <button type="submit">修改密码</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="seller.js"></script>
</body>
</html>

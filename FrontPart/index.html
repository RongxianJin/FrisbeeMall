<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>FrisbeeMall</h1>
    </header>

    <section id="product-section">
        <div id="product-container">
            <!-- 商品信息通过JS动态填充 -->
        </div>

        <form id="buy-form" style="display:none;">
            <h3>购买信息</h3>
            <label for="name">姓名:</label>
            <input type="text" id="name" required placeholder="请输入姓名">
            <label for="email">邮箱:</label>
            <input type="email" id="email" required placeholder="请输入邮箱">
            <label for="phone">电话:</label>
            <input type="text" id="phone" required placeholder="请输入电话">
            <button type="submit">提交购买请求</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>

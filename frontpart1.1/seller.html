<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卖家后台 - 飞盘购物系统</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>卖家后台</h1>
        
        <div id="addProduct">
            <h2>添加商品</h2>
            <form id="productForm" enctype="multipart/form-data">
                <input type="text" id="productName" name="productName" placeholder="商品名称" required>
                <select id="categorySelect" name="categoryId" required>
                    <!-- 这里将动态加载类别选项 -->
                </select>
                <div id="editor">
                    <!-- 这里将使用Quill编辑器 -->
                </div>
                <input type="hidden" id="productDescription" name="productDescription">
                <input type="file" id="productImages" name="productImages" accept="image/*" multiple required>
                <input type="number" id="productStock" name="productStock" placeholder="库存数量" required>
                <input type="text" id="productPrice" name="productPrice" placeholder="商品价格" required>
                <button type="submit">添加商品</button>
            </form>
        </div>

        <div id="productManagement">
            <h2>商品管理</h2>
            <div id="productList"></div>
        </div>

        <div id="categoryManagement">
            <h2>类别管理</h2>
            <form id="categoryForm">
                <input type="text" id="categoryName" placeholder="类别名称" required>
                <select id="parentCategorySelect">
                    <option value="">无父类别</option>
                    <!-- 这里将动态加载父类别选项 -->
                </select>
                <button type="submit">添加类别</button>
            </form>
            <div id="categoryList"></div>
        </div>

        <div id="customerManagement">
            <h2>客户管理</h2>
            <div id="customerList"></div>
        </div>

        <div id="updatePassword">
            <h2>修改密码</h2>
            <form id="passwordForm">
                <input type="password" id="newPassword" placeholder="新密码" required>
                <button type="submit">修改密码</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="seller.js"></script>
</body>
</html>
